name: Verify rtxexec
on:
  pull_request:
    paths: ['rtxexec/**', '.github/workflows/rtxexec.yml', '.github/workflows/pp-cli-publish.yml', 'scripts/publish-pp-cli-packages*']
  push:
    paths: ['rtxexec/**', '.github/workflows/rtxexec.yml', '.github/workflows/pp-cli-publish.yml', 'scripts/publish-pp-cli-packages*']
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: rtxexec
      - run: npm pack --dry-run
        working-directory: rtxexec
      - run: node --test scripts/publish-pp-cli-packages.test.mjs
