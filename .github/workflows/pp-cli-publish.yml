name: Publish @realtimex/pp-cli

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-pp-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Install cli-printing-press
        working-directory: .
        run: go install github.com/mvanhorn/cli-printing-press/v4/cmd/cli-printing-press@v4.20.1

      - name: Install dependencies
        run: npm ci

      - name: Build @realtimex/pp-cli packages
        run: npm run pp-cli:build

      - name: Verify wrapper version matches SDK version
        working-directory: .
        run: |
          SDK_VERSION=$(node -p "require('./typescript/package.json').version")
          node ./pp-cli/main/bin/realtimex-pp-cli.js --version | tee /tmp/pp-cli-version.txt
          grep "realtimex-pp-cli ${SDK_VERSION}" /tmp/pp-cli-version.txt

      - name: Publish @realtimex/pp-cli packages
        run: npm run pp-cli:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
