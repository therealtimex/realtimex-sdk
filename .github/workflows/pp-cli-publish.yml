name: Publish @realtimex SDK and PP CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Defaults to typescript/package.json.'
        required: false
        default: ''
      openapi_url:
        description: 'Required URL to download the OpenAPI spec used for CLI/skill generation.'
        required: true
        default: ''
      openapi_sha256:
        description: 'Optional SHA256 digest for the downloaded OpenAPI spec.'
        required: false
        default: ''
permissions:
  contents: write

concurrency:
  group: publish-pp-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Install cli-printing-press
        working-directory: .
        run: go install github.com/mvanhorn/cli-printing-press/v4/cmd/cli-printing-press@v4.20.1

      - name: Apply workflow inputs
        working-directory: .
        env:
          INPUT_VERSION: ${{ inputs.version }}
          OPENAPI_URL: ${{ inputs.openapi_url }}
          OPENAPI_SHA256: ${{ inputs.openapi_sha256 }}
          OPENAPI_DOWNLOAD_TOKEN: ${{ secrets.OPENAPI_DOWNLOAD_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION}" ]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.INPUT_VERSION.trim().replace(/^v/, '');
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid version input: ${process.env.INPUT_VERSION}`);
          }
          const packagePath = 'typescript/package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 4)}\n`);
          NODE
          fi

          if [ -z "${OPENAPI_URL}" ]; then
            echo "openapi_url is required. Generate OpenAPI in the app GitLab pipeline and pass the artifact URL." >&2
            exit 1
          fi

          CURL_ARGS=(-fsSL "${OPENAPI_URL}" -o openapi.json)
          if [ -n "${OPENAPI_DOWNLOAD_TOKEN}" ]; then
            CURL_ARGS=(-H "PRIVATE-TOKEN: ${OPENAPI_DOWNLOAD_TOKEN}" "${CURL_ARGS[@]}")
          fi
          curl "${CURL_ARGS[@]}"

          if [ -n "${OPENAPI_SHA256}" ]; then
            ACTUAL="$(sha256sum openapi.json | awk '{print $1}')"
            EXPECTED="$(echo "${OPENAPI_SHA256}" | sed 's/^sha256://' | awk '{print tolower($1)}')"
            if [ "${ACTUAL}" != "${EXPECTED}" ]; then
              echo "OpenAPI SHA256 mismatch. Expected ${EXPECTED}, received ${ACTUAL}" >&2
              exit 1
            fi
          fi
      - name: Resolve publish version
        id: version
        working-directory: .
        run: |
          VERSION="$(node -p "require('./typescript/package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ] && [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}" >&2
              exit 1
            fi
          fi

      - name: Build @realtimex/pp-cli packages
        run: npm run pp-cli:build

      - name: Verify wrapper version matches SDK version
        working-directory: .
        run: |
          SDK_VERSION="${{ steps.version.outputs.version }}"
          node ./pp-cli/main/bin/realtimex-pp-cli.js --version | tee /tmp/pp-cli-version.txt
          grep "realtimex-pp-cli ${SDK_VERSION}" /tmp/pp-cli-version.txt

      - name: Generate @realtimex/sdk skill assets
        working-directory: .
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          npm --prefix typescript run skill:generate

          SKILL_DIR="typescript/skills/realtimex-moderator-sdk"
          test -f "${SKILL_DIR}/SKILL.md"
          grep "npm install -g @realtimex/pp-cli@${VERSION}" "${SKILL_DIR}/SKILL.md"
          grep "realtimex-pp-cli ${VERSION}" "${SKILL_DIR}/SKILL.md"

      - name: Publish @realtimex/sdk and @realtimex/pp-cli packages
        run: npm run pp-cli:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          OPENAPI_SHA256: ${{ inputs.openapi_sha256 }}
        run: |
          set -euo pipefail

          NOTES_FILE="release-notes.md"
          {
            echo "Published RealtimeX SDK and Printing Press CLI ${VERSION}."
            echo ""
            echo "Packages:"
            echo "- @realtimex/sdk@${VERSION}"
            echo "- @realtimex/pp-cli@${VERSION}"
            echo "- @realtimex/pp-cli-darwin-x64@${VERSION}"
            echo "- @realtimex/pp-cli-darwin-arm64@${VERSION}"
            echo "- @realtimex/pp-cli-linux-x64@${VERSION}"
            echo "- @realtimex/pp-cli-linux-arm64@${VERSION}"
            echo "- @realtimex/pp-cli-win32-x64@${VERSION}"
            echo "- @realtimex/pp-cli-win32-arm64@${VERSION}"
            if [ -n "${OPENAPI_SHA256}" ]; then
              echo ""
              echo "OpenAPI SHA256: ${OPENAPI_SHA256}"
            fi
          } > "${NOTES_FILE}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "@realtimex/sdk and @realtimex/pp-cli ${VERSION}" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "@realtimex/sdk and @realtimex/pp-cli ${VERSION}" \
              --notes-file "${NOTES_FILE}"
          fi

