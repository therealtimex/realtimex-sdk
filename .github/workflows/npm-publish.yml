name: Publish to npm

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.8)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0). Defaults to package.json version.'
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Resolve target version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TARGET_VERSION="${GITHUB_REF_NAME#v}"
          else
            INPUT_VERSION="${{ github.event.inputs.version }}"
            TARGET_VERSION="${INPUT_VERSION:-$PACKAGE_VERSION}"
          fi

          echo "package_version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "target_version=${TARGET_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Validate version consistency
        shell: bash
        run: |
          if [[ "${{ steps.version.outputs.target_version }}" != "${{ steps.version.outputs.package_version }}" ]]; then
            echo "::error::Version mismatch. target=${{ steps.version.outputs.target_version }} package.json=${{ steps.version.outputs.package_version }}"
            exit 1
          fi
      
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
      
      - name: Build
        run: npm run build
      
      - name: Publish to npm (trusted publishing)
        run: npm publish --access public --provenance
