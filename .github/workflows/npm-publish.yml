name: Publish to npm

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.8)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Fetch openapi.json from GitLab app repo
        working-directory: .
        env:
          APP_REPO_READ_TOKEN: ${{ secrets.APP_REPO_READ_TOKEN }}
          APP_PROJECT_ID: ${{ vars.APP_PROJECT_ID }}
        run: |
          mkdir -p realtimex-ai-app/server/swagger
          curl -fsSL \
            -H "PRIVATE-TOKEN: $APP_REPO_READ_TOKEN" \
            "https://rtgit.rta.vn/api/v4/projects/1583/repository/files/server%2Fswagger%2Fopenapi.json/raw?ref=realtimex-dev" \
            -o realtimex-ai-app/server/swagger/openapi.json
          echo "Fetched $(wc -c < realtimex-ai-app/server/swagger/openapi.json) bytes"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
      
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
