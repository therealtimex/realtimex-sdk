name: Publish to npm

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.8)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for npm Trusted Publishing (OIDC)

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Fetch app repo source files from GitLab
        working-directory: .
        env:
          APP_REPO_READ_TOKEN: ${{ secrets.APP_REPO_READ_TOKEN }}
        run: |
          API="https://rtgit.rta.vn/api/v4"
          PROJECT_ID="1583"
          REF="realtimex-dev"
          DEST="../realtimex-ai-app"

          fetch() {
            local file="$1"
            local encoded=$(echo "$file" | sed 's|/|%2F|g')
            mkdir -p "$DEST/$(dirname "$file")"
            curl -fsSL \
              -H "PRIVATE-TOKEN: $APP_REPO_READ_TOKEN" \
              "$API/projects/$PROJECT_ID/repository/files/$encoded/raw?ref=$REF" \
              -o "$DEST/$file"
            echo "  $(wc -c < "$DEST/$file") bytes  $file"
          }

          echo "Fetching app repo source files @ $REF"
          fetch server/swagger/openapi.json
          fetch server/prisma/schema.prisma
          fetch server/utils/files/personalityStorage.js
          fetch server/models/heartbeat.js
          fetch server/models/workspace.js
          fetch server/models/agentSkills.js

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
      
      - name: Publish to npm
        run: |
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          npm publish --provenance --access public
