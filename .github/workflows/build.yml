name: Build

on:
  pull_request:
  push:
    branches:
      - realtimex-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Install cli-printing-press
        working-directory: .
        run: go install github.com/mvanhorn/cli-printing-press/v4/cmd/cli-printing-press@v4.20.1

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript SDK
        run: npm run build

      - name: Build CLI skill
        run: npm run skill:generate
