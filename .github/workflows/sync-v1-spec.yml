name: Sync v1 SDK from local OpenAPI spec

# Triggered by the realtimex-ai-app GitLab CI after relevant app changes,
# or manually via workflow_dispatch.
#
# Required secrets (Settings → Secrets and Variables → Actions):
#   APP_REPO_READ_TOKEN  — GitLab personal/project access token with read_api scope
#                          on the app repo at rtgit.rta.vn
#
# Required inputs (provided by GitLab CI dispatch or manual run):
#   app_project_id  — GitLab numeric project ID of realtimex-ai-app
#   app_ref         — commit SHA or branch to read supporting app source files from (default: realtimex-dev)

on:
  workflow_dispatch:
    inputs:
      app_project_id:
        description: 'GitLab project ID of the app repo'
        required: true
        default: ''
      app_ref:
        description: 'Branch / SHA to read supporting app source files from'
        required: false
        default: 'realtimex-dev'

concurrency:
  group: sync-v1-spec
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout SDK repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch app repo source files from GitLab
        env:
          APP_REPO_READ_TOKEN: ${{ secrets.APP_REPO_READ_TOKEN }}
        run: |
          API="https://rtgit.rta.vn/api/v4"
          PROJECT_ID="${{ inputs.app_project_id }}"
          REF="${{ inputs.app_ref || 'realtimex-dev' }}"
          DEST="_app_repo"

          fetch() {
            local file="$1"
            local encoded=$(echo "$file" | sed 's|/|%2F|g')
            mkdir -p "$DEST/$(dirname "$file")"
            curl -fsSL \
              -H "PRIVATE-TOKEN: $APP_REPO_READ_TOKEN" \
              "$API/projects/$PROJECT_ID/repository/files/$encoded/raw?ref=$REF" \
              -o "$DEST/$file"
            echo "  $(wc -c < "$DEST/$file") bytes  $file"
          }

          echo "Fetching app repo source files @ $REF"
          fetch server/prisma/schema.prisma
          fetch server/utils/files/personalityStorage.js
          fetch server/models/heartbeat.js
          fetch server/models/workspace.js
          fetch server/models/agentSkills.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Install cli-printing-press
        run: go install github.com/mvanhorn/cli-printing-press/v4/cmd/cli-printing-press@v4.20.1

      - name: Run SDK generator
        run: |
          node scripts/generate-v1-sdk.mjs --force
          node scripts/generate-skill.mjs --force

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet -- \
            'typescript/src/v1/modules/' \
            'python/realtimex_sdk/v1/' \
            'typescript/src/v1/namespace.ts' \
            'typescript/src/v1/index.ts' \
            'python/realtimex_sdk/v1/__init__.py' \
            'python/realtimex_sdk/v1/namespace.py' \
            'scripts/generate-skill.mjs' \
            'typescript/skills/realtimex-moderator-sdk/' \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: No changes — done
        if: steps.diff.outputs.changed == 'false'
        run: echo "No SDK changes detected. Spec is already up to date."

      - name: Open SDK sync PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_SHORT_SHA=$(echo "${{ inputs.app_ref }}" | cut -c1-8)
          BRANCH="ci/sdk-sync-${APP_SHORT_SHA}-$(date +%Y%m%d-%H%M%S)"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          git add \
            typescript/src/v1/modules/ \
            python/realtimex_sdk/v1/ \
            typescript/src/v1/namespace.ts \
            typescript/src/v1/index.ts \
            python/realtimex_sdk/v1/__init__.py \
            python/realtimex_sdk/v1/namespace.py \
            scripts/.sdk-spec-digest.json \
            scripts/generate-skill.mjs \
            typescript/skills/realtimex-moderator-sdk/

          git commit -m "chore: sync v1 SDK from local openapi.json"
          git push origin "$BRANCH"

          CHANGED_MODULES=$(git diff HEAD~1 --name-only \
            -- 'typescript/src/v1/modules/' \
            | sed 's|typescript/src/v1/modules/||;s|\.ts$||' \
            | sort | uniq | tr '\n' ' ')

          gh pr create \
            --title "chore: sync v1 SDK from local openapi.json" \
            --body "$(cat <<EOF
          ## Automated SDK sync

          Regenerated SDK artifacts from the checked-in \`openapi.json\`.

          **Changed modules:** ${CHANGED_MODULES:-see diff}

          - Re-run generator: \`npm run sdk:generate\`
          - Check any \`@streaming-stub\` / \`@upload-stub\` markers in new methods.
          EOF
          )" \
            --base realtimex-dev \
            --head "$BRANCH"
